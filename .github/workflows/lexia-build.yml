name: Vérification LEXIA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexia-starter
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer les dépendances
        run: npm install
      - name: Vérifier le build Next.js
        run: npm run build

